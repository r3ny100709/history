<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>History</title>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg1:#d6edff; --bg2:#eef8ff; --bg3:#ffffff;
  --ink:#3f7fb5; --soft:#a9d6f5; --line:#c9e6fa; --card:rgba(255,255,255,.78); --shadow:rgba(100,170,230,.28);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg1:#243d55; --bg2:#1d3248; --bg3:#172a3d;
    --ink:#cde9ff; --soft:#7fbfee; --line:#4a7497; --card:rgba(36,61,85,.75); --shadow:rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"]{
  --bg1:#243d55; --bg2:#1d3248; --bg3:#172a3d;
  --ink:#cde9ff; --soft:#7fbfee; --line:#4a7497; --card:rgba(36,61,85,.75); --shadow:rgba(0,0,0,.3);
}
html,body{margin:0;min-height:100%}
body{
  overflow-x:hidden;min-height:100vh;
  background:var(--bg2);
  background:radial-gradient(circle at 15% 12%,var(--bg3) 0,transparent 45%),
             radial-gradient(circle at 88% 85%,var(--bg1) 0,transparent 55%),
             linear-gradient(160deg,var(--bg1),var(--bg2) 50%,var(--bg3));
  background-attachment:fixed;
  font-family:'Mali','Sarabun','Noto Sans Thai',sans-serif;
  color:var(--ink);
}
#sky{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.drop{position:absolute;top:-40px;opacity:.7;animation:fall linear forwards;user-select:none}
@keyframes fall{to{transform:translateY(115vh) rotate(-15deg);opacity:0}}
.cloud{position:absolute;width:140px;height:44px;background:var(--bg3);border-radius:44px;opacity:.85;animation:drift 40s linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:inherit;border-radius:50%}
.cloud::before{width:62px;height:62px;top:-30px;left:24px}
.cloud::after{width:48px;height:48px;top:-20px;left:70px}
.c1{top:9%;left:-160px}
.c2{top:30%;left:-160px;transform:scale(.7);animation-duration:55s;animation-delay:-20s}
.c3{top:62%;left:-160px;transform:scale(.55);animation-duration:70s;animation-delay:-45s}
@keyframes drift{to{translate:calc(100vw + 340px)}}
.blog{position:relative;z-index:1;max-width:720px;margin:0 auto;padding:28px 18px 48px;min-height:100vh;display:flex;flex-direction:column;gap:26px}
.top{position:relative;background:var(--card);border:3px solid var(--soft);outline:3px dotted var(--line);outline-offset:4px;border-radius:28px;padding:22px 20px;text-align:center;box-shadow:0 8px 20px var(--shadow)}
.top h1{margin:0;font-size:clamp(2.4rem,12vw,3.6rem);line-height:1;letter-spacing:2px}
.tag{position:absolute;top:-18px;right:20px;font-size:26px;background:var(--bg2);border:3px solid var(--soft);border-radius:50%;width:42px;height:42px;display:flex;align-items:center;justify-content:center}
#list{display:flex;flex-direction:column;gap:30px;flex:1}
.post{position:relative;padding:22px 20px;background:var(--card);border:3px solid var(--soft);outline:3px dotted var(--line);outline-offset:4px;border-radius:28px;box-shadow:0 8px 20px var(--shadow)}
.post.empty{min-height:45vh}
.date{font-size:.85rem;font-weight:700;color:var(--soft);margin-bottom:4px}
.post h2{margin:0 0 10px;font-size:1.4rem}
.body{white-space:pre-wrap;line-height:1.7;word-break:break-word}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div id="sky">
  <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
</div>
<main class="blog">
  <header class="top"><span class="tag">📖</span><h1>History</h1></header>
  <section id="list"></section>
</main>

<!-- ใส่โพสต์ตรงนี้ (เรียงเองได้ เดี๋ยวโค้ดเรียงตามวันที่ให้) -->
<script id="data" type="application/json">[
  {
    "id": "1",
    "date": "2026-10-04",
    "title": "Update",
    "body": "สร้าง UI Lobby, History | prompt by clude | \n เชื่อมลิ้ง History เข้าหน้าต่าง Lobby | prompt by Chatgpt |"
  }
]</script>

<script>
const list=document.getElementById('list');
let posts=[];
try{posts=JSON.parse(document.getElementById('data').textContent||'[]')}catch(e){}

const fmt=d=>{
  try{return new Date(d+'T00:00').toLocaleDateString('th-TH',{day:'numeric',month:'long',year:'numeric'})}
  catch(e){return d}
};
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!==undefined)e.textContent=x;return e};
const tag=(a,i)=>a.appendChild(el('span','tag',i));

posts.sort((a,b)=>b.date.localeCompare(a.date)); // ใหม่สุดอยู่บน
if(!posts.length){
  const a=el('article','post empty');tag(a,'☁️');list.append(a);
}
posts.forEach(p=>{
  const a=el('article','post');tag(a,'📖');
  a.append(el('div','date',fmt(p.date)));
  if(p.title)a.append(el('h2','',p.title));
  a.append(el('div','body',p.body));
  list.append(a);
});

// หยดน้ำ/ประกายตกเบา ๆ
const sky=document.getElementById('sky'),icons=['💧','🤍','❄️','💙','✨'];
function spawn(){
  const e=document.createElement('span');
  e.className='drop';
  e.textContent=icons[Math.floor(Math.random()*icons.length)];
  e.style.left=Math.random()*100+'vw';
  e.style.fontSize=(12+Math.random()*16)+'px';
  e.style.animationDuration=(8+Math.random()*8)+'s';
  sky.appendChild(e);
  setTimeout(()=>e.remove(),17000);
}
setInterval(spawn,900);
for(let i=0;i<6;i++)setTimeout(spawn,i*200);
</script>
</body>
</html>
