<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<title>History</title>

<link
  href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600;700;800&display=swap"
  rel="stylesheet"
>

<style>

/* =====================================================
   VARIABLES
===================================================== */

:root{

  --red:#ff1738;
  --red-soft:#ff5268;
  --red-dark:#8f1025;

  --white:#ffffff;
  --text:#eeeeee;
  --muted:#a9a9a9;

  --bg:#000000;

  --card:rgba(10,10,10,.82);

  --line:rgba(255,23,56,.65);

  --shadow:rgba(255,23,56,.18);
}


/* =====================================================
   BASIC
===================================================== */

*{
  box-sizing:border-box;
}

html,
body{

  margin:0;

  min-height:100%;

}


body{

  overflow-x:hidden;

  min-height:100vh;

  background:#000;

  font-family:
    'Oxanium',
    'Sarabun',
    'Noto Sans Thai',
    sans-serif;

  color:var(--text);

}


/* =====================================================
   MAIN
===================================================== */

.blog{

  position:relative;

  z-index:1;

  width:100%;

  max-width:720px;

  min-height:100vh;

  margin:0 auto;

  padding:
    28px
    18px
    48px;

  display:flex;

  flex-direction:column;

  gap:26px;

}


/* =====================================================
   BACK BUTTON
===================================================== */

.back-button{

  display:inline-flex;

  align-items:center;

  justify-content:center;

  align-self:flex-start;

  gap:8px;

  padding:
    10px
    18px;

  background:
    rgba(10,10,10,.9);

  border:
    1px solid
    rgba(255,23,56,.8);

  border-radius:14px;

  color:#fff;

  font-family:
    'Oxanium',
    'Sarabun',
    'Noto Sans Thai',
    sans-serif;

  font-size:.95rem;

  font-weight:700;

  letter-spacing:.5px;

  text-decoration:none;

  box-shadow:

    0 0 8px
    rgba(255,23,56,.25),

    inset 0 0 12px
    rgba(255,23,56,.04);

  transition:

    transform .2s ease,

    border-color .2s ease,

    box-shadow .2s ease,

    background .2s ease;

  cursor:pointer;

  -webkit-tap-highlight-color:transparent;

}


.back-button:hover{

  transform:
    translateY(-3px);

  background:
    rgba(35,0,7,.9);

  border-color:
    var(--red);

  box-shadow:

    0 0 10px
    rgba(255,23,56,.5),

    0 0 22px
    rgba(255,23,56,.15);

}


.back-button:active{

  transform:
    scale(.97);

}


/* =====================================================
   HEADER
===================================================== */

.top{

  position:relative;

  background:

    linear-gradient(
      135deg,
      rgba(25,0,5,.9),
      rgba(8,8,8,.9)
    );

  border:
    1px solid
    rgba(255,23,56,.8);

  border-radius:24px;

  padding:
    24px
    20px;

  text-align:center;

  box-shadow:

    0 0 10px
    rgba(255,23,56,.25),

    0 0 30px
    rgba(255,23,56,.08),

    inset 0 0 20px
    rgba(255,23,56,.04);

}


/* =====================================================
   HEADER TITLE
===================================================== */

.top h1{

  margin:0;

  font-size:
    clamp(
      2.2rem,
      11vw,
      3.5rem
    );

  line-height:1;

  font-weight:800;

  letter-spacing:3px;

  color:#fff;

  text-shadow:

    0 0 7px
    rgba(255,255,255,.6),

    0 0 16px
    rgba(255,23,56,.8),

    0 0 32px
    rgba(255,23,56,.35);

}


/* =====================================================
   CREDIT
===================================================== */

.run-by{

  margin:
    10px 0 0;

  font-size:.72rem;

  font-weight:500;

  letter-spacing:1px;

  color:#888;

  line-height:1.7;

  text-shadow:

    0 0 6px
    rgba(255,23,56,.25);

}


/* =====================================================
   HEADER EMOJI
===================================================== */

.top > .tag{

  position:absolute;

  top:-17px;

  right:20px;

  width:44px;

  height:44px;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:24px;

  background:#050505;

  border:
    2px solid
    var(--red);

  border-radius:50%;

  box-shadow:

    0 0 9px
    rgba(255,23,56,.55),

    0 0 20px
    rgba(255,23,56,.2);

}


/* =====================================================
   POST LIST
===================================================== */

#list{

  display:flex;

  flex-direction:column;

  gap:24px;

  flex:1;

}


/* =====================================================
   POST
===================================================== */

.post{

  position:relative;

  padding:
    22px
    20px
    22px
    24px;

  background:

    linear-gradient(
      135deg,
      rgba(18,18,18,.9),
      rgba(5,5,5,.86)
    );

  border:
    1px solid
    rgba(255,23,56,.62);

  border-radius:20px;

  box-shadow:

    0 0 8px
    rgba(255,23,56,.12),

    inset 0 0 18px
    rgba(255,23,56,.035);

  transition:

    transform .2s ease,

    border-color .2s ease,

    box-shadow .2s ease;

}


/* =====================================================
   POST RED ACCENT
===================================================== */

.post::before{

  content:"";

  position:absolute;

  left:11px;

  top:14px;

  bottom:14px;

  width:2px;

  border-radius:10px;

  background:
    var(--red);

  box-shadow:

    0 0 7px
    rgba(255,23,56,.6);

}


.post:hover{

  transform:
    translateY(-3px);

  border-color:
    rgba(255,82,104,.95);

  box-shadow:

    0 0 12px
    rgba(255,23,56,.3),

    0 0 25px
    rgba(255,23,56,.08),

    inset 0 0 18px
    rgba(255,23,56,.05);

}


.post.empty{

  min-height:45vh;

}


/* =====================================================
   POST EMOJI
===================================================== */

.post > .tag{

  position:absolute;

  top:16px;

  right:17px;

  width:38px;

  height:38px;

  display:flex;

  align-items:center;

  justify-content:center;

  background:#050505;

  border:
    1px solid
    rgba(255,23,56,.7);

  border-radius:50%;

  font-size:20px;

  box-shadow:

    0 0 7px
    rgba(255,23,56,.25);

}


/* =====================================================
   DATE
===================================================== */

.date{

  margin-bottom:6px;

  font-size:.8rem;

  font-weight:600;

  letter-spacing:.8px;

  color:
    var(--red-soft);

}


/* =====================================================
   POST TITLE
===================================================== */

.post h2{

  margin:
    0
    0
    12px;

  padding-right:48px;

  font-size:1.35rem;

  font-weight:800;

  letter-spacing:.5px;

  color:#fff;

  text-shadow:

    0 0 8px
    rgba(255,23,56,.3);

}


/* =====================================================
   POST BODY
===================================================== */

.body{

  white-space:pre-wrap;

  line-height:1.75;

  word-break:break-word;

  color:#dddddd;

  font-family:
    'Sarabun',
    'Noto Sans Thai',
    sans-serif;

  font-size:1rem;

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width:480px){

  .blog{

    padding:
      22px
      14px
      40px;

  }

  .post{

    padding:
      20px
      18px
      20px
      22px;

  }

}


/* =====================================================
   REDUCED MOTION
===================================================== */

@media (prefers-reduced-motion:reduce){

  *{

    animation:none !important;

    transition:none !important;

  }

}

</style>

</head>


<body>


<!-- =====================================================
     MAIN
===================================================== -->

<main class="blog">


  <!-- ===================================================
       BACK TO LOBBY
  ==================================================== -->

  <a
    class="back-button"
    href="https://r3ny100709.github.io/lobby1/"
  >
    ← Lobby
  </a>


  <!-- ===================================================
       HISTORY HEADER
  ==================================================== -->

  <header class="top">

    <span class="tag">
      📖
    </span>

    <h1>
      History
    </h1>

    <p class="run-by">
      Code by GitHub
    </p>

  </header>


  <!-- ===================================================
       POSTS
  ==================================================== -->

  <section id="list"></section>

</main>


<!-- =================================================
     ใส่โพสต์ตรงนี้

     สามารถเพิ่มโพสต์ได้เรื่อย ๆ
     ระบบจะเรียงวันที่ใหม่สุดไว้ด้านบน
================================================= -->

<script id="data" type="application/json">

[
  {
    "id": "1",
    "date": "2026-10-04",
    "title": "Update",
    "body": "สร้าง UI Lobby, History | code by clude \nเชื่อมลิ้ง History เข้าหน้าต่าง Lobby | code by Chatgpt | \nเพิ่มปุ่ม Back to lobby | code by Chatgpt | \nปรับสีพื้นหลัง, เพิ่ม Animation วนลูป, ปรับฟอนต์ใหม่ | code by Chatgpt |"
  },
  {
    "id": "2",
    "date": "2026-10-04",
    "title": "Update Lobby",
    "body": ""
  }
]

</script>


<script>

/* =====================================================
   DATA
===================================================== */

const list =
  document.getElementById('list');


let posts = [];


try{

  posts =
    JSON.parse(
      document
        .getElementById('data')
        .textContent || '[]'
    );

}catch(e){}


/* =====================================================
   DATE FORMAT
===================================================== */

const fmt = d => {

  try{

    return new Date(
      d + 'T00:00'
    ).toLocaleDateString(
      'th-TH',
      {
        day:'numeric',
        month:'long',
        year:'numeric'
      }
    );

  }catch(e){

    return d;

  }

};


/* =====================================================
   CREATE ELEMENT
===================================================== */

const el = (t,c,x) => {

  const e =
    document.createElement(t);

  if(c)
    e.className=c;

  if(x !== undefined)
    e.textContent=x;

  return e;

};


const tag = (a,i) => {

  a.appendChild(
    el('span','tag',i)
  );

};


/* =====================================================
   SORT POSTS
===================================================== */

posts.sort(
  (a,b) =>
    b.date.localeCompare(a.date)
);


/* =====================================================
   EMPTY STATE
===================================================== */

if(!posts.length){

  const a =
    el(
      'article',
      'post empty'
    );

  tag(a,'📖');

  list.append(a);

}


/* =====================================================
   DISPLAY POSTS
===================================================== */

posts.forEach(p => {

  const a =
    el(
      'article',
      'post'
    );

  tag(a,'📖');

  a.append(
    el(
      'div',
      'date',
      fmt(p.date)
    )
  );

  if(p.title){

    a.append(
      el(
        'h2',
        '',
        p.title
      )
    );

  }

  a.append(
    el(
      'div',
      'body',
      p.body
    )
  );

  list.append(a);

});


</script>


</body>

</html>
