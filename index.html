<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<title>Gallery — Rainy.Ren</title>

<link
  href="https://fonts.googleapis.com/css2?family=Oxanium:wght@400;500;600;700;800&display=swap"
  rel="stylesheet"
>

<style>

/* =====================================================
   VARIABLES
===================================================== */

:root{

  --red:#ff1738;
  --red-soft:#ff5268;
  --red-dark:#8f1025;

  --white:#ffffff;
  --text:#eeeeee;
  --muted:#999999;

  --bg:#000000;

  --card:#0b0b0b;

  --line:rgba(255,23,56,.65);

}


/* =====================================================
   BASIC
===================================================== */

*{
  box-sizing:border-box;
}

html,
body{

  margin:0;

  min-height:100%;

}

body{

  overflow-x:hidden;

  min-height:100vh;

  background:#000;

  font-family:
    'Oxanium',
    'Sarabun',
    'Noto Sans Thai',
    sans-serif;

  color:var(--text);

}


/* =====================================================
   MAIN
===================================================== */

.gallery{

  position:relative;

  z-index:1;

  width:100%;

  max-width:760px;

  min-height:100vh;

  margin:0 auto;

  padding:
    28px
    18px
    50px;

}


/* =====================================================
   BACK BUTTON
===================================================== */

.back-button{

  position:relative;

  display:inline-flex;

  align-items:center;

  justify-content:center;

  min-width:120px;

  height:42px;

  padding:
    0
    18px;

  margin-bottom:24px;

  background:
    linear-gradient(
      135deg,
      rgba(255,23,56,.08),
      rgba(5,5,5,.95)
    );

  border:
    1px solid
    rgba(255,23,56,.75);

  border-radius:12px;

  color:#fff;

  font-family:
    'Oxanium',
    'Sarabun',
    'Noto Sans Thai',
    sans-serif;

  font-size:.85rem;

  font-weight:600;

  letter-spacing:1px;

  text-decoration:none;

  box-shadow:

    0 0 8px
    rgba(255,23,56,.18),

    inset 0 0 12px
    rgba(255,23,56,.035);

  transition:
    .25s ease;

  overflow:hidden;

  -webkit-tap-highlight-color:transparent;

}


.back-button::before{

  content:"";

  position:absolute;

  inset:4px;

  border:
    1px solid
    rgba(255,23,56,.15);

  border-radius:8px;

  pointer-events:none;

}


.back-button:hover{

  transform:
    translateY(-2px);

  border-color:
    var(--red);

  background:
    linear-gradient(
      135deg,
      rgba(255,23,56,.16),
      rgba(5,5,5,.95)
    );

  box-shadow:

    0 0 10px
    rgba(255,23,56,.4),

    0 0 24px
    rgba(255,23,56,.12);

}


.back-button:active{

  transform:
    scale(.97);

}


/* =====================================================
   HEADER
===================================================== */

.header{

  position:relative;

  margin-bottom:24px;

  padding:
    24px
    20px;

  background:
    linear-gradient(
      135deg,
      rgba(25,0,5,.9),
      rgba(7,7,7,.95)
    );

  border:
    1px solid
    rgba(255,23,56,.75);

  border-radius:22px;

  text-align:center;

  box-shadow:

    0 0 10px
    rgba(255,23,56,.22),

    0 0 30px
    rgba(255,23,56,.07),

    inset 0 0 20px
    rgba(255,23,56,.035);

}


/* =====================================================
   HEADER TITLE
===================================================== */

.header h1{

  margin:0;

  font-size:
    clamp(
      2.2rem,
      11vw,
      3.5rem
    );

  line-height:1;

  font-weight:800;

  letter-spacing:3px;

  color:#fff;

  text-shadow:

    0 0 7px
    rgba(255,255,255,.6),

    0 0 16px
    rgba(255,23,56,.8),

    0 0 32px
    rgba(255,23,56,.35);

}


/* =====================================================
   HEADER ICON
===================================================== */

.header .tag{

  position:absolute;

  top:-16px;

  right:20px;

  width:44px;

  height:44px;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:23px;

  background:#050505;

  border:
    2px solid
    var(--red);

  border-radius:50%;

  box-shadow:

    0 0 9px
    rgba(255,23,56,.55),

    0 0 20px
    rgba(255,23,56,.2);

}


/* =====================================================
   CATEGORY TABS
===================================================== */

.categories{

  display:grid;

  grid-template-columns:
    1fr 1fr;

  gap:12px;

  margin-bottom:24px;

}


/* =====================================================
   CATEGORY BUTTON
===================================================== */

.category{

  position:relative;

  min-height:62px;

  padding:
    14px
    12px;

  border:
    1px solid
    rgba(255,23,56,.45);

  border-radius:16px;

  background:
    linear-gradient(
      135deg,
      rgba(18,18,18,.95),
      rgba(5,5,5,.95)
    );

  color:#aaa;

  font-family:
    'Oxanium',
    'Sarabun',
    'Noto Sans Thai',
    sans-serif;

  font-size:1rem;

  font-weight:700;

  letter-spacing:.7px;

  cursor:pointer;

  transition:
    .25s ease;

  box-shadow:

    0 0 7px
    rgba(255,23,56,.08),

    inset 0 0 14px
    rgba(255,23,56,.025);

  -webkit-tap-highlight-color:transparent;

}


.category:hover{

  color:#fff;

  border-color:
    rgba(255,23,56,.8);

  transform:
    translateY(-2px);

  box-shadow:

    0 0 10px
    rgba(255,23,56,.25),

    0 0 22px
    rgba(255,23,56,.08);

}


.category.active{

  color:#fff;

  border:
    1px solid
    var(--red);

  background:
    linear-gradient(
      135deg,
      rgba(55,0,10,.95),
      rgba(8,8,8,.98)
    );

  box-shadow:

    0 0 10px
    rgba(255,23,56,.35),

    0 0 28px
    rgba(255,23,56,.1),

    inset 0 0 18px
    rgba(255,23,56,.06);

}


.category.active::after{

  content:"";

  position:absolute;

  left:20%;

  right:20%;

  bottom:-1px;

  height:2px;

  background:
    var(--red);

  box-shadow:
    0 0 8px
    rgba(255,23,56,.8);

}


/* =====================================================
   GALLERY LIST
===================================================== */

#galleryList{

  display:flex;

  flex-direction:column;

  gap:24px;

}


/* =====================================================
   WORK CARD
===================================================== */

.work{

  position:relative;

  overflow:hidden;

  background:
    linear-gradient(
      135deg,
      rgba(18,18,18,.96),
      rgba(5,5,5,.96)
    );

  border:
    1px solid
    rgba(255,23,56,.55);

  border-radius:20px;

  box-shadow:

    0 0 8px
    rgba(255,23,56,.1),

    inset 0 0 18px
    rgba(255,23,56,.025);

  transition:
    transform .25s ease,
    border-color .25s ease,
    box-shadow .25s ease;

}


.work:hover{

  transform:
    translateY(-3px);

  border-color:
    rgba(255,82,104,.9);

  box-shadow:

    0 0 12px
    rgba(255,23,56,.25),

    0 0 25px
    rgba(255,23,56,.08);

}


/* =====================================================
   IMAGE AREA
===================================================== */

.work-image{

  width:100%;

  aspect-ratio:
    16 / 9;

  display:flex;

  align-items:center;

  justify-content:center;

  overflow:hidden;

  background:
    linear-gradient(
      135deg,
      #090909,
      #020202
    );

  border-bottom:
    1px solid
    rgba(255,23,56,.35);

}


/* REAL IMAGE */

.work-image img{

  width:100%;

  height:100%;

  display:block;

  object-fit:cover;

}


/* EMPTY IMAGE AREA */

.work-image.empty{

  color:
    rgba(255,23,56,.45);

  font-size:.75rem;

  font-weight:600;

  letter-spacing:2px;

  text-transform:uppercase;

}


.work-image.empty span{

  padding:
    10px
    16px;

  border:
    1px dashed
    rgba(255,23,56,.35);

  border-radius:10px;

}


/* =====================================================
   WORK CONTENT
===================================================== */

.work-content{

  padding:
    20px
    20px
    22px;

}


.work-title{

  margin:0 0 9px;

  color:#fff;

  font-size:1.3rem;

  font-weight:800;

  letter-spacing:.5px;

  text-shadow:
    0 0 8px
    rgba(255,23,56,.25);

}


.work-description{

  margin:0;

  color:#bcbcbc;

  font-family:
    'Sarabun',
    'Noto Sans Thai',
    sans-serif;

  font-size:.96rem;

  line-height:1.8;

  white-space:pre-wrap;

}


/* =====================================================
   EMPTY CATEGORY
===================================================== */

.empty-category{

  min-height:42vh;

  display:flex;

  flex-direction:column;

  align-items:center;

  justify-content:center;

  padding:30px;

  border:
    1px dashed
    rgba(255,23,56,.4);

  border-radius:20px;

  background:
    rgba(7,7,7,.8);

  text-align:center;

}


.empty-category .empty-icon{

  font-size:38px;

  margin-bottom:12px;

  filter:
    drop-shadow(
      0 0 8px
      rgba(255,23,56,.35)
    );

}


.empty-category h2{

  margin:0 0 8px;

  font-size:1.2rem;

  color:#fff;

}


.empty-category p{

  margin:0;

  color:#777;

  font-family:
    'Sarabun',
    'Noto Sans Thai',
    sans-serif;

  line-height:1.7;

}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width:480px){

  .gallery{

    padding:
      22px
      14px
      40px;

  }

  .categories{

    gap:9px;

  }

  .category{

    min-height:58px;

    font-size:.9rem;

  }

  .work-content{

    padding:
      18px
      17px
      20px;

  }

  .work-title{

    font-size:1.15rem;

  }

  .work-description{

    font-size:.9rem;

  }

}


/* =====================================================
   REDUCED MOTION
===================================================== */

@media (prefers-reduced-motion:reduce){

  *{

    animation:none !important;

    transition:none !important;

  }

}

</style>

</head>


<body>


<main class="gallery">


  <!-- ===================================================
       BACK TO LOBBY
  ==================================================== -->

  <a
    class="back-button"
    href="https://r3ny100709.github.io/lobby1/"
  >
    ← Lobby
  </a>


  <!-- ===================================================
       GALLERY HEADER
  ==================================================== -->

  <header class="header">

    <span class="tag">
      🖼️
    </span>

    <h1>
      Gallery
    </h1>

  </header>


  <!-- ===================================================
       CATEGORY
  ==================================================== -->

  <nav class="categories">

    <button
      class="category active"
      data-category="artwork"
      type="button"
    >
      Art work
    </button>

    <button
      class="category"
      data-category="design"
      type="button"
    >
      Design
    </button>

  </nav>


  <!-- ===================================================
       WORKS
  ==================================================== -->

  <section id="galleryList"></section>


</main>


<!-- =====================================================
     GALLERY DATA

     เพิ่มผลงานในอนาคตตรงนี้ได้เลย

     category:
       artwork = Art work
       design  = Design

     image:
       ใส่ชื่อไฟล์รูป เช่น
       "./artwork-01.jpg"

     ถ้ายังไม่มีรูป
       image: ""

===================================================== -->

<script id="galleryData" type="application/json">

[
  {
    "id":"art-001",
    "category":"artwork",
    "image":"",
    "title":"Artwork",
    "description":"พื้นที่สำหรับรายละเอียดของผลงานชิ้นนี้"
  },

  {
    "id":"design-001",
    "category":"design",
    "image":"",
    "title":"Design",
    "description":"พื้นที่สำหรับรายละเอียดของงานออกแบบ"
  }
]

</script>


<script>

/* =====================================================
   ELEMENTS
===================================================== */

const list =
  document.getElementById(
    'galleryList'
  );

const buttons =
  document.querySelectorAll(
    '.category'
  );


/* =====================================================
   DATA
===================================================== */

let works = [];

try{

  works =
    JSON.parse(
      document
        .getElementById(
          'galleryData'
        )
        .textContent || '[]'
    );

}catch(error){

  works = [];

}


/* =====================================================
   CREATE WORK CARD
===================================================== */

function createWork(work){

  const article =
    document.createElement(
      'article'
    );

  article.className =
    'work';


  /* IMAGE */

  const imageBox =
    document.createElement(
      'div'
    );

  imageBox.className =
    'work-image';


  if(work.image){

    const img =
      document.createElement(
        'img'
      );

    img.src =
      work.image;

    img.alt =
      work.title || 'Artwork';

    imageBox.appendChild(
      img
    );

  }else{

    imageBox.classList.add(
      'empty'
    );

    const placeholder =
      document.createElement(
        'span'
      );

    placeholder.textContent =
      'Image';

    imageBox.appendChild(
      placeholder
    );

  }


  /* CONTENT */

  const content =
    document.createElement(
      'div'
    );

  content.className =
    'work-content';


  const title =
    document.createElement(
      'h2'
    );

  title.className =
    'work-title';

  title.textContent =
    work.title || 'Untitled';


  const description =
    document.createElement(
      'p'
    );

  description.className =
    'work-description';

  description.textContent =
    work.description || '';


  content.append(
    title,
    description
  );


  article.append(
    imageBox,
    content
  );


  return article;

}


/* =====================================================
   EMPTY CATEGORY
===================================================== */

function showEmpty(category){

  const box =
    document.createElement(
      'div'
    );

  box.className =
    'empty-category';


  const icon =
    document.createElement(
      'div'
    );

  icon.className =
    'empty-icon';

  icon.textContent =
    category === 'artwork'
      ? '🎨'
      : '✦';


  const title =
    document.createElement(
      'h2'
    );

  title.textContent =
    category === 'artwork'
      ? 'Art work'
      : 'Design';


  const text =
    document.createElement(
      'p'
    );

  text.textContent =
    'ยังไม่มีผลงานในหมวดนี้';


  box.append(
    icon,
    title,
    text
  );


  list.appendChild(
    box
  );

}


/* =====================================================
   RENDER
===================================================== */

function render(category){

  list.innerHTML = '';


  const filtered =
    works.filter(
      work =>
        work.category === category
    );


  if(!filtered.length){

    showEmpty(category);

    return;

  }


  filtered.forEach(
    work => {

      list.appendChild(
        createWork(work)
      );

    }
  );

}


/* =====================================================
   CATEGORY SWITCH
===================================================== */

buttons.forEach(
  button => {

    button.addEventListener(
      'click',
      () => {

        buttons.forEach(
          item =>
            item.classList.remove(
              'active'
            )
        );


        button.classList.add(
          'active'
        );


        render(
          button.dataset.category
        );

      }
    );

  }
);


/* =====================================================
   INITIAL
===================================================== */

render('artwork');

</script>


</body>

</html>
